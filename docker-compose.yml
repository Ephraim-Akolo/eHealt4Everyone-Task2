services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-only-insecure-key}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-true}
    depends_on:
      - redis

volumes:
  redis_data:

  